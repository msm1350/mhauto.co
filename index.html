<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&H Motors | خرید، بازرسی و صادرات خودرو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b1329;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #172a45;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border: 1px solid #233554;
        }
        .site-image {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        h1 {
            color: #64ffda;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #8892b0;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #64ffda;
            color: #0a192f;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #52d1b2;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- اینجا عکس شما نمایش داده می‌شود -->
        <img src="اسم_عکس_شما.jpg" alt="M&H Motors" class="site-image">
        
        <h1>M&H Motors</h1>
        <p>خدمات تخصصی تامین، بازرسی فنی، رنگ و بدنه و صادرات انواع خودرو.</p>
        <a href="https://wa.me/" class="btn">ارتباط مستقیم در واتس‌اپ</a>
    </div>
</body>
</html>
