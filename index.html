<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&H Motors | خرید، بازرسی و صادرات خودرو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b1329;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #172a45;
            max-width: 650px;
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border: 1px solid #233554;
        }
        .site-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #64ffda;
            color: #0a192f;
            padding: 12px 35px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #52d1b2;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- نمایش کامل پوستر طراحی شده -->
        <img src="mhautolanding.jpg" alt="M&H Motors" class="site-image">
        
        <!-- دکمه دسترسی سریع -->
        <a href="https://wa.me/" class="btn">ارتباط مستقیم در واتس‌اپ</a>
    </div>
</body>
</html>
